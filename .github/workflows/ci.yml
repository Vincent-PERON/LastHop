name: ci
on:
  push: {branches: [main]}
  pull_request:

# Droits minimaux par défaut ; chaque job n'ajoute que ce dont il a besoin.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Toutes les actions tierces sont épinglées par SHA de commit (le tag est en commentaire) : un tag déplacé ne peut pas
# injecter de code dans la CI. Renovate maintient ces épinglages.
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check app tests && ruff format --check app tests migrations
      - run: mypy app
      - run: bandit -q -r app
      - name: Vulnérabilités des dépendances Python (production et développement)
        run: |
          pip-audit -r requirements.lock --no-deps --disable-pip
          pip-audit -r requirements-dev.lock --no-deps --disable-pip
      - name: Interdiction de tout SET SNMP
        run: "! grep -rEn 'set_cmd|SetRequest|setCmd' app"

  front:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: {run: {working-directory: front}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "24"}
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate        # prod + dev : 0 vulnérabilité attendue (overrides minimatch/glob)

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - run: ./scripts/gen-secrets.sh
      # Suite complète : PostgreSQL 16 + Redis réels, simulateurs SNMP (Aruba, Comware, Cisco ; v2c et v3) et SSH
      - run: docker compose -f docker-compose.test.yml run --rm --build tests

  # Analyse statique, secrets et configuration (code source uniquement, aucun build)
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}   # historique complet : un secret ancien doit aussi être détecté
      - name: Secrets (gitleaks, historique git inclus)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo -c /repo/.gitleaks.toml --redact --no-banner --exit-code 1
      - name: Semgrep (Python, OWASP Top 10, JavaScript, Dockerfile, secrets)
        run: >
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.185.0 semgrep
          --config p/python --config p/owasp-top-ten --config p/javascript --config p/dockerfile --config p/secrets
          --metrics=off --error --exclude node_modules --exclude dist
          backend/app front/src front/index.html backend/Dockerfile front/Dockerfile docker-compose.yml proxy
      - name: Dockerfile (hadolint)
        run: |
          for f in backend/Dockerfile front/Dockerfile tests-infra/snmpsim/Dockerfile tests-infra/sshsim/Dockerfile; do
            echo "== $f"; docker run --rm -i hadolint/hadolint:v2.14.0 hadolint - < "$f"
          done
      - name: Trivy — dépendances, secrets et mauvaises configurations du dépôt
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: front/node_modules,front/dist

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [tests, front]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - run: docker build --target runtime -t lasthop-api:ci backend
      - run: docker build -t lasthop-front:ci front
      - name: Trivy — image API
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {image-ref: "lasthop-api:ci", severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true}
      - name: Trivy — image front
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {image-ref: "lasthop-front:ci", severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true}
      - name: Inventaire des composants (SBOM CycloneDX)
        run: |
          for i in api front; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" aquasec/trivy:0.76.2 \
              image --format cyclonedx --output "/out/sbom-$i.cdx.json" --quiet "lasthop-$i:ci"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: sbom, path: "sbom-*.cdx.json", retention-days: 90}
      - name: Le conteneur front démarre sans privilège, en lecture seule
        run: |
          docker run -d --name front --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp lasthop-front:ci
          for _ in $(seq 1 20); do [ "$(docker inspect -f '{{.State.Health.Status}}' front)" = healthy ] && exit 0; sleep 3; done
          docker logs front; exit 1

  # Sur les pull requests : refuse l'ajout d'une dépendance vulnérable (HIGH+) ou sous licence incompatible.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with: {fail-on-severity: high}
