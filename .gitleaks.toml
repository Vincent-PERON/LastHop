title = "LastHop"

[extend]
useDefault = true

# Valeurs JETABLES des tests (simulateurs SNMP/SSH dans un réseau Docker éphémère) : ce ne sont pas des secrets.
# L'exception est limitée à ces motifs exacts, pas à des dossiers entiers : tout autre secret reste détecté.
[[allowlists]]
description = "identifiants de test du simulateur SNMP/SSH"
regexes = [
  '''test-(auth|priv)-key-1234''',
  '''wrong-(auth|priv)-key-9999''',
  '''test-ssh-password-1234''',
  '''^snmp_[a-z0-9_]+$''',   # nom d'un réglage dans une requête SQL de test (WHERE key='snmp_…')
]

# Mots de passe jetables des jeux de tests (compte local de test, annuaire de test…). Limité à la règle générique et aux
# dossiers de tests : les clés/jetons identifiables (AWS, GitHub, clés privées…) restent détectés partout, tests compris.
[[allowlists]]
description = "mots de passe jetables des tests"
targetRules = ["generic-api-key"]
paths = ['''backend/tests/''', '''front/tests/''', '''tests-infra/''']
