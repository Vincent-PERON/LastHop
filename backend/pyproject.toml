[project]
name = "lasthop"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "ASYNC"]
ignore = ["B008"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "E501", "B017", "ASYNC"]
"migrations/**" = ["S608", "E501"]
"app/services/backup_messages.py" = ["E501"]  # textes lisibles par un humain : phrases longues voulues
"app/services/ssh_backup.py" = ["E501"]
"app/services/cli.py" = ["E501", "S105"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]
[[tool.mypy.overrides]]
module = ["joserfc.*", "celery.*", "pysnmp.*", "pyasn1.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = ["app"]
