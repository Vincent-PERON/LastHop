# Annuaire LDAP de TEST (GLAuth) : comptes et mots de passe jetables, réseau Docker éphémère uniquement.
[ldap]
  enabled = true
  listen = "0.0.0.0:3893"

[ldaps]
  enabled = true
  listen = "0.0.0.0:3894"
  cert = "/certs/server.crt"
  key = "/certs/server.key"

[backend]
  datastore = "config"
  baseDN = "dc=lab,dc=local"

[behaviors]
  IgnoreCapabilities = false
  LimitFailedBinds = false

